services:
  db:
    image: postgres:18-alpine
    container_name: clipviewer-db
    environment:
      - POSTGRES_USER=clipviewer
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - see .env.example}
      - POSTGRES_DB=clipviewer
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipviewer -d clipviewer"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clipviewer-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Database=clipviewer;Username=clipviewer;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - see .env.example}
      - JwtSettings__Secret=${JWT_SECRET:?JWT_SECRET must be set - see .env.example}
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
    ports:
      - "5000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  worker:
    container_name: clipviewer-worker
    restart: unless-stopped
    build:
      context: .
      dockerfile: ClipViewer.Worker/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=clipviewer;Username=clipviewer;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - see .env.example}
    volumes:
      - ./output:/app/output
      - ./worker-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # No HTTP endpoint to probe - just confirm the worker process (PID 1) is still alive
      test: ["CMD-SHELL", "grep -q dotnet /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:

