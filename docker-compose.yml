version: '3.8'

services:
  db:
    image: postgres:18-alpine
    container_name: clipviewer-db
    environment:
      - POSTGRES_USER=clipviewer
      - POSTGRES_PASSWORD=clipviewer123
      - POSTGRES_DB=clipviewer
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipviewer -d clipviewer"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clipviewer-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ./output:/app/output
    ports:
      - "5000:80"
    restart: unless-stopped

volumes:
  postgres_data:
