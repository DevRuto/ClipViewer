name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet:
    name: .NET build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ClipViewer.sln

      - name: Build
        run: dotnet build ClipViewer.sln --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test ClipViewer.UnitTests --no-build --configuration Release

      - name: Integration tests
        run: dotnet test ClipViewer.IntegrationTests --no-build --configuration Release

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clipviewer.vue
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: clipviewer.vue/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- run

      - name: Build
        run: npm run build
